openapi: 3.0.3
info:
  title: MultiGuide API
  version: 1.0.0
  description: >-
    Guest-facing contract (PRD v1.1, section 7).
    JSON properties use snake_case. Timestamps are UTC, ISO 8601 with Z suffix.
servers:
  - url: /api/v1
tags:
  - name: Areas
  - name: Sessions
  - name: Payments
  - name: Passes
  - name: Pois
  - name: Media
  - name: PlayLogs
paths:
  /areas/{code}:
    get:
      tags: [Areas]
      operationId: getArea
      summary: Get area info from the QR code (US-01)
      parameters:
        - name: code
          in: path
          required: true
          description: Area code printed in the QR.
          schema:
            type: string
            maxLength: 50
          example: hoi-an
      responses:
        '200':
          description: Area found and active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaResponse'
        '404':
          description: Area does not exist or is inactive.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                status: 404
                code: AREA_NOT_FOUND
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
components:
  securitySchemes:
    AccessPass:
      type: http
      scheme: bearer
      description: >-
        Opaque access token returned once by POST /payments.
        Send as Authorization: Bearer <access_token>.
  schemas:
    ProblemDetails:
      type: object
      description: Error body (RFC 7807) with a stable code and a trace id.
      required: [status, code, traceId]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          example: AREA_NOT_FOUND
          enum:
            - PASS_MISSING
            - AUTH_REQUIRED
            - PASS_INVALID
            - PASS_EXPIRED
            - PASS_AREA_MISMATCH
            - FORBIDDEN
            - AREA_NOT_FOUND
            - POI_CONTENT_NOT_FOUND
            - TRANSLATION_EXISTS
            - PAYMENT_FAILED
            - VALIDATION_ERROR
            - IDEMPOTENCY_KEY_REUSED
            - ACCOUNT_LOCKED
            - RATE_LIMITED
        traceId:
          type: string
    AreaResponse:
      type: object
      required: [code, name, price_usd, pass_ttl_hours]
      properties:
        code:
          type: string
          example: hoi-an
        name:
          type: string
          example: Hoi An Ancient Town
        price_usd:
          type: number
          description: Price of one access pass in USD.
          example: 2.00
        pass_ttl_hours:
          type: integer
          description: Hours an access pass stays valid after payment.
          example: 24

